name: CI

concurrency:
  group: ct-e2e-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:
    inputs:
      e2e-suite:
        description: gate = PR gate (excludes @a11y); full = include @a11y
        type: choice
        options:
          - gate
          - full
        default: full
  pull_request:
    branches:
      - master
    types: [opened, synchronize]  # Triggers on PR open and commits to PR
    paths-ignore:
      - '**.md'
      - 'LICENSE*'
      - '.gitignore'

jobs:
  ci:
    uses: h5p/h5p-ci-workflows/.github/workflows/h5p-ci-workflow.yml@master
    with:
      run-translations: true
      run-e2e: true
      e2e-suite: ${{ github.event_name == 'workflow_dispatch' && inputs.e2e-suite || 'gate' }}
    secrets: inherit
